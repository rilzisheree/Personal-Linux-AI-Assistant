[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "A native PySide6 desktop chat client for a local Ollama server"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "openai-whisper>=20240930",
    "piper-tts>=1.2.0",
]

[project.scripts]
local-ai-assistant = "local_ai_assistant.app:main"
local-ai-assistant-api = "local_ai_assistant.api:main"
lura-telegram = "local_ai_assistant.telegram_bot:main"

[tool.setuptools.packages.find]
include = ["local_ai_assistant*"]
