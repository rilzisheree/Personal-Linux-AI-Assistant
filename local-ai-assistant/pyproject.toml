[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "A native PySide6 desktop chat client for a local Ollama server"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
local-ai-assistant = "local_ai_assistant.app:main"

[tool.setuptools.packages.find]
include = ["local_ai_assistant*"]
