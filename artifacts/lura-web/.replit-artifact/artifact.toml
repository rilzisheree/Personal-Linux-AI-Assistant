kind = "web"
previewPath = "/lura-web/"
title = "Lura Mobile Companion"
description = "A mobile-friendly web companion for the Lura local AI assistant, with password login, conversation history, model status, and streamed chat through the existing local API."
version = "1.0.0"
id = "artifacts/lura-web"
router = "path"

[[services]]
name = "web"
paths = [ "/lura-web/" ]
localPort = 22125

[services.development]
run = "pnpm --filter @workspace/lura-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lura-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/lura-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22125"
BASE_PATH = "/lura-web/"
